<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Nazar Misiura">
  <meta name="date" content="2026-11-08">
  <title>Zielony Kącik Warzywniczy | Formularz | Wykonał KOWALSKI</title>
  <!-- Praca praktyczna, 2026-11-08 — Nazar Misiura. -->
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f2f6f5; color: #303b39; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 680px); padding: 22px; background: #fff; }
    .page-icon { width: 34px; height: 34px; }
    h1 { margin: 12px 0 8px; color: #286d55; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    .intro { margin-bottom: 20px; color: #526675; line-height: 1.5; }
    form { display: grid; gap: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    label, legend { color: #394a45; font-size: 0.92rem; font-weight: 400; }
    input, select, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 8px;
      border: 1px solid #cbd6d1;
      border-radius: 0;
      background: #fff;
      color: #243746;
      font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 1px solid #286d55; }
    textarea { min-height: 74px; resize: vertical; }
    fieldset { margin: 0; padding: 10px 0; border: 0; }
    legend { padding: 0; }
    .choice { display: inline-flex; align-items: center; gap: 8px; margin: 8px 18px 0 0; font-weight: 400; }
    .choice input, .consent input { width: auto; margin: 0; accent-color: #286d55; }
    .consent { display: flex; align-items: flex-start; gap: 9px; font-weight: 400; line-height: 1.5; }
    button {
      justify-self: start;
      padding: 9px 14px;
      border: 0;
      border-radius: 0;
      background: #286d55;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #205644; }
    .form-note { margin: 0; color: #647783; font-size: 0.88rem; line-height: 1.5; }
    hr { height: 2px; margin: 28px 0 16px; border: 0; background: #95bdcf; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    a { color: #286d55; font-weight: 600; text-underline-offset: 3px; }
    @media (max-width: 560px) {
      body { padding: 14px; }
      .field-grid { grid-template-columns: 1fr; }
      footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <img class="page-icon" src="assets/form.svg" alt="">
    <h1>Formularz zamówienia</h1>
    <p class="intro">Zamów świeże warzywa i owoce. Wypełnij formularz, a przygotujemy wiadomość e-mail z Twoim zamówieniem.</p>
    <form action="mailto:" method="post" enctype="text/plain">
      <div class="field-grid">
        <label for="name">Imię i nazwisko
          <input id="name" name="Imię i nazwisko" autocomplete="name" required>
        </label>
        <label for="email">Adres e-mail
          <input id="email" name="E-mail" type="email" autocomplete="email" required>
        </label>
        <label for="phone">Telefon (opcjonalnie)
          <input id="phone" name="Telefon" type="tel" autocomplete="tel">
        </label>
        <label for="product">Wybierz produkt
          <select id="product" name="Produkt" required>
            <option value="" selected disabled>Wybierz z listy</option>
            <option>Marchew — 5,00 zł/kg</option>
            <option>Pomidor — 9,00 zł/kg</option>
            <option>Ziemniaki — 3,50 zł/kg</option>
            <option>Jabłka — 6,00 zł/kg</option>
            <option>Ogórki — 7,00 zł/kg</option>
            <option>Truskawki — 14,00 zł/kg</option>
          </select>
        </label>
        <label for="quantity">Ilość (kg)
          <input id="quantity" name="Ilość (kg)" type="number" min="0.5" step="0.5" value="1" required>
        </label>
      </div>
      <fieldset>
        <legend>Sposób odbioru</legend>
        <label class="choice"><input type="radio" name="Odbiór" value="Odbiór osobisty" checked> Odbiór osobisty</label>
        <label class="choice"><input type="radio" name="Odbiór" value="Dostawa"> Dostawa</label>
      </fieldset>
      <label for="message">Dodatkowe informacje
        <textarea id="message" name="Uwagi" placeholder="Napisz, jeśli masz dodatkowe życzenia"></textarea>
      </label>
      <label class="consent"><input type="checkbox" name="Zgoda" value="Tak" required> Zgadzam się na kontakt w sprawie realizacji zamówienia.</label>
      <button type="submit">Przygotuj zamówienie</button>
      <p class="form-note">Wysłanie formularza otworzy domyślny program pocztowy z przygotowaną wiadomością. Strona nie zapisuje zamówień.</p>
    </form>
    <hr>
    <footer><span>© Nazar Misiura</span><a href="strona_menu_kowalski.html">Powrót do menu</a></footer>
  </main>
</body>
</html>

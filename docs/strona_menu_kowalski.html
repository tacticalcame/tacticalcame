<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Zielony Kącik Warzywniczy | Wykonał KOWALSKI</title>
  <!-- Praca praktyczna, 2026-11-08 — Nazar Misiura. -->
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f7f8f4;
      color: #30362e;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 400px);
      padding: 16px 8px;
    }

    h1 {
      margin: 0 0 8px;
      color: #286d35;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 600;
    }

    p {
      margin: 0 0 20px;
      color: #747a70;
    }

    nav {
      display: grid;
    }

    nav a {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #e3e7df;
      color: #286d35;
      text-decoration: underline;
    }

    nav a:hover {
      color: #286d35;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
    }

    footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #747a70;
      font-size: 0.9rem;
    }

    footer a {
      color: #286d35;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>To jest strona menu</h1>
    <p>Wybierz stronę:</p>
    <nav aria-label="Menu strony">
      <a href="index.html"><img class="nav-icon" src="assets/home.svg" alt="">Strona Główna</a>
      <a href="formularz_kowalski.html"><img class="nav-icon" src="assets/form.svg" alt="">Strona Formularza</a>
      <a href="tabela_kowalski.html"><img class="nav-icon" src="assets/table.svg" alt="">Strona Tabeli</a>
      <a href="poczta_kowalski.html"><img class="nav-icon" src="assets/mail.svg" alt="">Strona Poczty</a>
    </nav>
    <footer>
      <span>© Nazar Misiura</span>
      <a href="index.html">Strona główna</a>
    </footer>
  </main>
</body>
</html>
